<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tactile info Bamboulab</title>

<!-- ESP Web Tools -->
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

</head>
<body>
<h2>Installer le firmware ESP32</h2>

<!-- Input pour sélectionner un .bin local -->
<input type="file" id="local-bin" accept=".bin" />

<!-- Bouton d’installation ESP Web Flasher -->
<esp-web-install-button id="btn"></esp-web-install-button>

<script type="module">
const btn = document.getElementById('btn');
const fileInput = document.getElementById('local-bin');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    // Crée un manifest temporaire pointant sur le fichier choisi
    btn.manifest = {
      name: "Tactile info bamboulab",
      version: "1.0",
      builds: [{
        chipFamily: "ESP32",
        parts: [{
          path: file,
          offset: 65536
        }]
      }]
    };
  }
});
</script>
</body>
</html>
